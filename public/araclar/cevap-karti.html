<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cevap Kartı · Yapay Zeka ve Sağlık</title>
<meta name="description" content="Derste telefonunuzu kaldırarak cevap vermek için: Gerçek/Uydurma ya da A–E.">
<style>
  :root{--ink:#10262e;--paper:#faf8f4;--ok:#1f7a4d;--bad:#be3a5a;--brand:#0f4c5c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{padding:16px 18px 6px;text-align:center} header h1{margin:0;font-size:18px} header p{margin:4px 0 0;font-size:13px;color:#6a838b}
  .modes{display:flex;justify-content:center;gap:8px;padding:8px}
  .modes button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 14px;border:1px solid #cfc6b8;background:#fff;color:#34515b}
  .modes button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{flex:1;display:grid;gap:12px;padding:12px 16px 24px}
  main.gu{grid-template-rows:1fr 1fr} main.abcde{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
  main button{font:inherit;font-weight:800;font-size:clamp(28px,8vw,48px);border:0;border-radius:24px;color:#fff;cursor:pointer}
  .g{background:var(--ok)} .u{background:var(--bad)} .l{background:var(--brand)}
  #full{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:min(60vw,70vh);letter-spacing:-.04em}
  #full[data-on]{display:flex} #full small{position:absolute;bottom:24px;font-size:16px;font-weight:600;opacity:.85;letter-spacing:0}
</style>
</head>
<body>
<header><h1>Cevap Kartı</h1><p>Bir seçeneğe dokun, telefonu kaldır. Ekrana tekrar dokununca geri döner.</p></header>
<div class="modes"><button aria-pressed="true" data-mode="gu">Gerçek / Uydurma</button><button aria-pressed="false" data-mode="abcde">A – E</button></div>
<main id="main" class="gu">
  <button class="g" data-v="GERÇEK" data-c="#1f7a4d">GERÇEK</button>
  <button class="u" data-v="UYDURMA" data-c="#be3a5a">UYDURMA</button>
</main>
<div id="full"><span id="txt"></span><small>dokununca kapanır</small></div>
<script>
const main = document.getElementById('main'), full = document.getElementById('full'), txt = document.getElementById('txt');
const HARF = ['A','B','C','D','E']; const RENK = ['#0f4c5c','#3b4cc0','#6d4bb5','#b7791f','#be3a5a'];
function kur(mode){
  main.className = mode;
  main.innerHTML = mode === 'gu'
    ? `<button class="g" data-v="GERÇEK" data-c="#1f7a4d">GERÇEK</button><button class="u" data-v="UYDURMA" data-c="#be3a5a">UYDURMA</button>`
    : HARF.map((h,i) => `<button class="l" style="background:${RENK[i]}" data-v="${h}" data-c="${RENK[i]}">${h}</button>`).join('');
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); kur(b.dataset.mode);
}));
main.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  txt.textContent = b.dataset.v; full.style.background = b.dataset.c; full.setAttribute('data-on','');
  if (navigator.vibrate) navigator.vibrate(30);
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});
full.addEventListener('click', () => { full.removeAttribute('data-on'); });
</script>
</body>
</html>
